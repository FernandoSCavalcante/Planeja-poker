<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlanejaPoker - Ultra Legendary Arena</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap"
      rel="stylesheet" />
    <style>
      :root {
        --primary: #8b5cf6;
        --secondary: #ec4899;
        --accent: #2ecc71;
        --glass: rgba(15, 23, 42, 0.75);
        --border: rgba(255, 255, 255, 0.1);
        --text-color: #ffffff;
        --card-bg: #ffffff;
        --card-text: #1e293b;
        --bg-gradient: linear-gradient(
          135deg,
          #020617 0%,
          #0f172a 50%,
          #1e1b4b 100%
        );
      }
      body.light-mode {
        --glass: rgba(255, 255, 255, 0.65);
        --border: rgba(0, 0, 0, 0.08);
        --text-color: #1e293b;
        --card-bg: #1e293b;
        --card-text: #ffffff;
        --primary: #0ea5e9;
        --secondary: #3b82f6;
        --bg-gradient: linear-gradient(
          135deg,
          #bae6fd 0%,
          #7dd3fc 50%,
          #e0f2fe 100%
        );
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg-gradient);
        background-attachment: fixed;
        color: var(--text-color);
        margin: 0;
        min-height: 100vh;
        transition: background 1s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      .legendary-hero {
        position: fixed;
        width: 30vw;
        height: 30vw;
        max-width: 400px;
        background-size: contain;
        background-repeat: no-repeat;
        z-index: -1;
        filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.15));
        animation: floatHero 8s ease-in-out infinite;
        pointer-events: none;
        opacity: 0.6;
      }
      .hero-left {
        left: -5%;
        bottom: -5%;
        transform: scaleX(-1);
      }
      .hero-right {
        right: -5%;
        top: -5%;
      }
      @keyframes floatHero {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-25px);
        }
      }

      .shake {
        animation: shake 0.5s both;
      }
      @keyframes shake {
        10%,
        90% {
          transform: translate3d(-1px, 0, 0);
        }
        20%,
        80% {
          transform: translate3d(2px, 0, 0);
        }
        40%,
        60% {
          transform: translate3d(4px, 0, 0);
        }
      }

      #loginScreen {
        width: 100%;
        max-width: 500px;
        padding: 20px;
        z-index: 10;
      }
      .login-box {
        background: var(--glass);
        backdrop-filter: blur(30px);
        padding: 40px;
        border-radius: 40px;
        border: 1px solid var(--border);
        text-align: center;
      }
      #gameScreen {
        display: none;
        width: 100%;
        flex-direction: row;
        min-height: 100vh;
      }

      .sidebar {
        width: 280px;
        background: var(--glass);
        backdrop-filter: blur(35px);
        border-right: 1px solid var(--border);
        padding: 25px 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .user-list-item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 255, 255, 0.05);
        padding: 10px;
        border-radius: 15px;
        border: 1px solid var(--border);
      }
      .user-list-item img {
        width: 35px;
        height: 35px;
      }

      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px;
        position: relative;
        overflow-y: auto;
      }
      .arena {
        width: 100%;
        max-width: 900px;
        background: var(--glass);
        border-radius: 40px;
        padding: 45px;
        border: 1px solid var(--border);
        position: relative;
      }
      .votes-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
        gap: 25px;
      }

      .pokeball-wrap {
        position: relative;
        width: 75px;
        height: 75px;
        margin: 0 auto;
      }
      .pokeball-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
        transition: 0.4s;
      }

      .pokemon-out {
        animation: burst 0.6s ease-out;
        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.8)) brightness(1.2);
      }

      @keyframes burst {
        0% {
          transform: scale(0);
          filter: brightness(5);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          filter: brightness(1.1);
        }
      }

      .v-box {
        width: 55px;
        height: 80px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.05);
        margin: 10px auto 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 1.8rem;
        border: 2px solid var(--border);
        transition: 0.6s;
        opacity: 0;
        transform: translateY(10px);
      }
      .v-box.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .v-box.revealed {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        transform: rotateY(360deg);
        box-shadow: 0 0 20px var(--primary);
      }

      .deck {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin: 30px 0;
      }
      .card {
        width: 60px;
        height: 90px;
        background: var(--card-bg);
        color: var(--card-text);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        font-weight: 900;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
      }
      .card:hover {
        transform: translateY(-10px);
        background: var(--primary);
        color: white;
      }
      .card.selected {
        background: var(--secondary);
        color: white;
        transform: scale(1.1);
        box-shadow: 0 0 20px var(--secondary);
      }

      .btn {
        padding: 15px 30px;
        border-radius: 18px;
        border: none;
        font-weight: 900;
        cursor: pointer;
        transition: 0.3s;
        text-transform: uppercase;
        font-size: 0.8rem;
      }
      .theme-toggle {
        position: fixed;
        top: 25px;
        right: 25px;
        background: rgba(0, 0, 0, 0.2);
        color: var(--text-color);
        border: 2px solid var(--border);
        width: 50px;
        height: 50px;
        border-radius: 50%;
        cursor: pointer;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #loginAvatars {
        max-height: 250px;
        overflow-y: auto;
        padding: 10px;
        background: rgba(0, 0, 0, 0.1);
        border-radius: 20px;
      }

      @media (max-width: 800px) {
        #gameScreen {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
          height: auto;
        }
        .legendary-hero {
          display: none;
        }
      }
    </style>
  </head>
  <body id="body">
    <div id="heroLeft" class="legendary-hero hero-left"></div>
    <div id="heroRight" class="legendary-hero hero-right"></div>
    <button class="theme-toggle" id="themeBtn">🌙</button>

    <div id="loginScreen">
      <div class="login-box">
        <h2 style="margin-bottom: 10px">GINÁSIO LENDÁRIO</h2>
        <p style="font-size: 0.8rem; opacity: 0.7; margin-bottom: 20px">
          Escolha seu guardião e entre na arena
        </p>
        <input
          type="text"
          id="loginName"
          placeholder="Seu Nome..."
          maxlength="12"
          style="
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            border: none;
            background: rgba(0, 0, 0, 0.15);
            color: var(--text-color);
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 20px;
            box-sizing: border-box;
          " />
        <div
          id="loginAvatars"
          style="
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
          "></div>
        <button
          class="btn"
          style="background: var(--primary); color: white; width: 100%"
          onclick="enterGym()">
          ENTRAR NA ARENA
        </button>
      </div>
    </div>

    <div id="gameScreen">
      <div class="sidebar">
        <div>
          <div
            style="
              display: flex;
              justify-content: space-between;
              border-bottom: 1px solid var(--border);
              padding-bottom: 10px;
              margin-bottom: 15px;
            ">
            <h2 style="font-size: 0.65rem; text-transform: uppercase">
              Treinadores
            </h2>
            <span id="userCount" style="font-weight: 900">0</span>
          </div>
          <div id="sidebarUsers"></div>
          <button
            class="btn"
            style="
              background: rgba(220, 38, 38, 0.1);
              color: #ef4444;
              width: 100%;
              font-size: 0.7rem;
              margin-top: 10px;
            "
            onclick="clearAllUsers()">
            LIMPAR ARENA (EXPULSAR TODOS)
          </button>
        </div>
        <button
          class="btn"
          style="
            background: rgba(128, 128, 128, 0.1);
            color: var(--text-color);
            margin-top: auto;
          "
          onclick="exitGym()">
          SAIR
        </button>
      </div>

      <div class="main-content">
        <div class="arena">
          <div
            id="resultInfo"
            style="
              position: absolute;
              top: -15px;
              left: 50%;
              transform: translateX(-50%);
              background: var(--accent);
              padding: 5px 25px;
              border-radius: 20px;
              font-weight: 900;
              color: #064e3b;
              display: none;
              z-index: 10;
            "></div>
          <div class="votes-grid" id="votesDisplay"></div>
        </div>
        <div class="deck" id="deck"></div>
        <div style="display: flex; gap: 15px">
          <button
            class="btn"
            style="
              background: linear-gradient(to right, #f59e0b, #d97706);
              color: white;
            "
            id="btnReveal">
            REVELAR VOTOS
          </button>
          <button
            class="btn"
            style="
              background: rgba(128, 128, 128, 0.2);
              color: var(--text-color);
              border: 1px solid var(--border);
            "
            id="btnReset">
            NOVA RODADA
          </button>
        </div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getDatabase,
        ref,
        set,
        onValue,
        remove,
        update,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDCZtpN68ZmtN3SWWMYSmZ5XgcNyPpw2lM",
        authDomain: "planejapoker.firebaseapp.com",
        databaseURL: "https://planejapoker-default-rtdb.firebaseio.com",
        projectId: "planejapoker",
        storageBucket: "planejapoker.firebasestorage.app",
        messagingSenderId: "506605019450",
        appId: "1:506605019450:web:09f9765505a7708c7cb003",
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const votesRef = ref(db, "poker/votes");
      const configRef = ref(db, "poker/config");

      const pokeballImg =
        "https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg";

      // Lista expandida com mais Pokémon Lendários
      const pokes = [
        { id: 150, name: "mewtwo" },
        { id: 151, name: "mew" },
        { id: 249, name: "lugia" },
        { id: 250, name: "hooh" },
        { id: 382, name: "kyogre" },
        { id: 383, name: "groudon" },
        { id: 384, name: "rayquaza" },
        { id: 483, name: "dialga" },
        { id: 484, name: "palkia" },
        { id: 487, name: "giratina" },
        { id: 493, name: "arceus" },
        { id: 643, name: "reshiram" },
        { id: 644, name: "zekrom" },
        { id: 716, name: "xerneas" },
        { id: 717, name: "yveltal" },
        { id: 791, name: "solgaleo" },
        { id: 792, name: "lunala" },
        { id: 888, name: "zacian" },
        { id: 889, name: "zamazenta" },
        { id: 1007, name: "koraidon" },
      ];

      let currentUser = { name: "", avatar: "", id: 150 };
      let isRevealed = false;
      let myVote = null;

      function updateHeroes(pokeId) {
        const url = `https://assets.pokemon.com/assets/cms2/img/pokedex/full/${pokeId
          .toString()
          .padStart(3, "0")}.png`;
        document.getElementById(
          "heroLeft"
        ).style.backgroundImage = `url('${url}')`;
        document.getElementById(
          "heroRight"
        ).style.backgroundImage = `url('${url}')`;
      }

      function renderLoginAvatars() {
        const container = document.getElementById("loginAvatars");
        container.innerHTML = "";
        pokes.forEach((p, idx) => {
          const gif = `https://play.pokemonshowdown.com/sprites/gen5ani/${p.name}.gif`;
          const div = document.createElement("div");
          div.style = "text-align:center; cursor:pointer;";
          const img = document.createElement("img");
          img.src = gif;
          img.style =
            "width: 50px; height: 50px; border-radius: 12px; border: 2px solid transparent; transition: 0.3s; background: rgba(255,255,255,0.05); object-fit: contain;";

          const label = document.createElement("div");
          label.innerText = p.name.toUpperCase();
          label.style =
            "font-size: 0.5rem; font-weight: 900; margin-top: 5px; opacity: 0.7;";

          if (idx === 0) {
            img.style.borderColor = "var(--primary)";
            currentUser.avatar = gif;
            currentUser.id = p.id;
            updateHeroes(p.id);
          }

          div.onclick = () => {
            document
              .querySelectorAll("#loginAvatars img")
              .forEach((i) => (i.style.borderColor = "transparent"));
            img.style.borderColor = "var(--primary)";
            currentUser.avatar = gif;
            currentUser.id = p.id;
            updateHeroes(p.id);
          };

          div.appendChild(img);
          div.appendChild(label);
          container.appendChild(div);
        });
      }

      window.enterGym = () => {
        const name = document.getElementById("loginName").value.trim();
        if (name.length < 2) return alert("Digite seu nome!");
        currentUser.name = name;
        set(ref(db, "poker/votes/" + name), {
          name,
          avatar: currentUser.avatar,
          pokeId: currentUser.id,
        });
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("gameScreen").style.display = "flex";
      };

      window.exitGym = () =>
        remove(ref(db, "poker/votes/" + currentUser.name)).then(() =>
          location.reload()
        );

      // Lógica para derrubar todos: Quando os votos somem, se o meu nome não está lá, eu saio.
      window.clearAllUsers = () => {
        if (confirm("Expulsar todos os treinadores da arena?")) {
          remove(votesRef);
        }
      };

      const fibo = [0, 1, 2, 3, 5, 8, 13, 21, "?"];
      const deckDiv = document.getElementById("deck");
      fibo.forEach((n) => {
        const c = document.createElement("div");
        c.className = "card";
        c.innerText = n;
        c.onclick = () => {
          if (isRevealed) return;
          myVote = n;
          document
            .querySelectorAll(".card")
            .forEach((i) => i.classList.remove("selected"));
          c.classList.add("selected");
          update(ref(db, "poker/votes/" + currentUser.name), { value: n });
        };
        deckDiv.appendChild(c);
      });

      function updateUI(data, revealed) {
        const display = document.getElementById("votesDisplay");
        const sidebar = document.getElementById("sidebarUsers");
        const countBadge = document.getElementById("userCount");
        const resInfo = document.getElementById("resultInfo");

        // Lógica de Force Logout: Se eu estou logado mas meu nome sumiu do DB (alguém limpou), eu volto pro login.
        if (currentUser.name && (!data || !data[currentUser.name])) {
          location.reload();
          return;
        }

        display.innerHTML = "";
        sidebar.innerHTML = "";
        if (!data) {
          countBadge.innerText = "0";
          return;
        }

        const users = Object.values(data);
        countBadge.innerText = users.length;

        let sum = 0,
          count = 0;
        users.forEach((u) => {
          sidebar.innerHTML += `<div class="user-list-item"><img src="${
            u.avatar
          }"> <span style="font-weight:700;">${u.name} ${
            u.value !== undefined ? "✓" : ""
          }</span></div>`;

          const hasVoted = u.value !== undefined;
          const displayImg = hasVoted ? u.avatar : pokeballImg;
          const imgClass = hasVoted ? "pokemon-out" : "";
          const vBoxVisible = hasVoted ? "visible" : "";

          if (revealed && hasVoted && !isNaN(parseFloat(u.value))) {
            sum += parseFloat(u.value);
            count++;
          }

          display.innerHTML += `
            <div style="text-align:center;">
              <div class="pokeball-wrap">
                <img src="${displayImg}" class="pokeball-img ${imgClass}">
              </div>
              <div class="v-box ${vBoxVisible} ${revealed ? "revealed" : ""}">
                ${revealed ? u.value : "?"}
              </div>
              <div style="font-size:0.75rem; font-weight:900; margin-top:10px; opacity:0.8;">${
                u.name
              }</div>
            </div>`;
        });

        if (revealed && count > 0) {
          resInfo.style.display = "block";
          resInfo.innerText = `MÉDIA: ${(sum / count).toFixed(1)}`;
        } else resInfo.style.display = "none";
      }

      onValue(configRef, (snap) => {
        const config = snap.val();
        const newRevealed = config ? config.revealed : false;
        if (newRevealed && !isRevealed) {
          document.getElementById("body").classList.add("shake");
          setTimeout(
            () => document.getElementById("body").classList.remove("shake"),
            500
          );
        }
        isRevealed = newRevealed;
        onValue(votesRef, (vSnap) => updateUI(vSnap.val(), isRevealed), {
          onlyOnce: true,
        });
      });

      onValue(votesRef, (snap) => updateUI(snap.val(), isRevealed));

      document.getElementById("btnReveal").onclick = () =>
        update(configRef, { revealed: true });

      document.getElementById("btnReset").onclick = () => {
        update(configRef, { revealed: false }).then(() => {
          onValue(
            votesRef,
            (snap) => {
              const data = snap.val();
              if (data) {
                const updates = {};
                Object.keys(data).forEach(
                  (k) => (updates[k + "/value"] = null)
                );
                update(votesRef, updates);
              }
            },
            { onlyOnce: true }
          );
          document
            .querySelectorAll(".card")
            .forEach((c) => c.classList.remove("selected"));
          myVote = null;
        });
      };

      document.getElementById("themeBtn").onclick = () => {
        document.body.classList.toggle("light-mode");
        document.getElementById("themeBtn").innerText =
          document.body.classList.contains("light-mode") ? "☀️" : "🌙";
      };

      renderLoginAvatars();
    </script>
  </body>
</html>
